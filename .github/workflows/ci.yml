name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history so commitlint can read the PR's commits
          fetch-depth: 0

      # Installs the pnpm version pinned in package.json#packageManager
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Biome checks formatting in core/poller/api via lint; the web app uses Prettier
      - name: Web formatting
        run: pnpm --filter @jobvr/web format:check

      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then pnpm exec commitlint --from "$BASE" --to HEAD
          else pnpm exec commitlint --last; fi

      # shellcheck is preinstalled on the runner
      - name: Deploy files
        run: |
          shellcheck deploy/backup.sh
          printf 'POSTGRES_PASSWORD=ci\nTS_AUTHKEY=ci\n' > .env
          docker compose -f docker-compose.yml config -q
          rm .env

      # Also builds the API client the web app type-checks against
      - name: Typecheck
        run: pnpm typecheck

      # Integration tests start Postgres 18 with Testcontainers (Docker is preinstalled)
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: jobvr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_USER=jobvr -e POSTGRES_PASSWORD=jobvr -e POSTGRES_DB=jobvr postgres:18
          until docker exec db pg_isready -U jobvr -d jobvr; do sleep 1; done
          docker run -d --name app --network smoke -p 3000:3000 \
            -e DATABASE_URL=postgres://jobvr:jobvr@db:5432/jobvr -e SCHEDULER_ENABLED=false jobvr:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health && curl -fsS http://localhost:3000/ | grep -q '<div id="root">'; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
